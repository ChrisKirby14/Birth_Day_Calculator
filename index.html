<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day of Birth Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- This links your separated JavaScript file -->
    <script src="birth-day-calculator.js" defer></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-50 via-white to-blue-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl shadow-xl shadow-indigo-100 p-8 w-full max-w-md border border-gray-100">
        <div class="text-center mb-8">
            <div class="text-5xl mb-3">🎂</div>
            <h1 class="text-2xl font-extrabold text-gray-800 tracking-tight">Day of Birth</h1>
            <p class="text-gray-500 text-sm mt-1">Find out what day of the week you were born</p>
        </div>
        <!-- Input Form -->
        <div class="space-y-5">
            <div class="grid grid-cols-3 gap-4">
                <!-- Day Input -->
                <div>
                    <label for="day" class="block text-xs font-semibold text-gray-600 uppercase tracking-wide mb-1">Day</label>
                    <input type="number" id="day" min="1" max="31" placeholder="DD"
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all text-center text-gray-700 text-lg">
                </div>
                <!-- Month Input -->
                <div>
                    <label for="month" class="block text-xs font-semibold text-gray-600 uppercase tracking-wide mb-1">Month</label>
                    <input type="number" id="month" min="1" max="12" placeholder="MM"
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all text-center text-gray-700 text-lg">
                </div>
                <!-- Year Input -->
                <div>
                    <label for="year" class="block text-xs font-semibold text-gray-600 uppercase tracking-wide mb-1">Year</label>
                    <input type="number" id="year" min="1900" max="2100" placeholder="YYYY"
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all text-center text-gray-700 text-lg">
                </div>
            </div>

            <!-- Error Message Container (Hidden by default) -->
            <div id="error-msg" class="hidden bg-red-50 text-red-600 text-sm py-2 px-4 rounded-lg text-center">
                Please enter a valid date.
            </div>

            <!-- Calculate Button -->
            <button id="calculate-btn"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3.5 px-4 rounded-xl shadow-md hover:shadow-lg transition-all active:scale-[0.98] mt-2">
                Calculate Day
            </button>
        </div>

        <!-- Result Area (Hidden by default) -->
        <div id="result-container" class="hidden mt-8 text-center pt-6 border-t border-gray-100">
            <p class="text-gray-500 text-sm mb-1">You were born on a</p>
            <h2 id="result-day" class="text-4xl font-extrabold text-indigo-600 tracking-tight">Monday</h2>
        </div>

    </div>
</body>
</html>
